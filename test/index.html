<!DOCTYPE 5>
<html lang="en">
  <head>
    <title>Overlay</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="../build/build.css" />
    <style>
      body > div:not(.overlay) {
        position: relative;
        padding: 15px 25px;
        border: 1px solid #eee;
        width: 200px;
      }
      body {
        padding: 150px;
      }
    </style>
  </head>
  <body>
    <title>Overlay</title>
    <script src="../build/build.js"></script>

    <div>
      <h2>Something</h2>
      <p>Some element here</p>
    </div>

    <script>
      overlay = overlay.default;
      const o = overlay({ closable: true });

      o.on('hide', () => {
        const div = document.querySelector('body > div');
        overlay(div).show();
      });

      o.show();
    </script>
  </body>
</html>
